    "notes": "<p>Tuesday, August 18, 2026. A short evening paddle at the south end of Waterbury Reservoir with both dogs, Teddy and Charlie — no track, no plan, just messing around for about an hour and going to look at the dam.</p><p><strong>The dam:</strong> paddled up to the orange boom line strung across the water in front of the intake structure, close enough to see the concrete gate tower and the long grassy face of the earthen embankment running up the east side. Charlie rode the nose in her yellow vest and watched the whole thing.</p><p><strong>The rest of it:</strong> turned back up the reservoir into the open water, hills on both sides and big afternoon cumulus stacking up over the ridgelines. Teddy took his turn on the bow. Water was calm with just a light ripple.</p>"

  {

/* ===== END DATA ===== */

// web build: photos are re-encoded to .jpg at 1600px, with a 640px copy under thumb/
const web = (p) => p.replace(/\.[^.]+$/, '.jpg');

const fmtDate = (e) => {
  const opts = {month:'short', day:'numeric', year:'numeric'};
  const s = new Date(e.date_start + 'T12:00').toLocaleDateString('en-US', opts);
  if (!e.date_end || e.date_end === e.date_start) return s;
  const en = new Date(e.date_end + 'T12:00').toLocaleDateString('en-US', opts);
  return s.replace(/, \d{4}$/,'') + ' – ' + en;
};

// Stats
function renderStats(list) {
  const mi = list.reduce((a,e)=>a+(e.distance_mi||0),0);
  const ft = list.reduce((a,e)=>a+(e.elevation_gain_ft||0),0);
  const peaks = list.reduce((a,e)=>a+(e.peaks?e.peaks.length:0),0);
  const wild = list.reduce((a,e)=>a+(e.wildlife?e.wildlife.length:0),0);
  document.getElementById('statbar').innerHTML =
    `<div class="stat"><div class="num">${list.length}</div><div class="lbl">Adventures</div></div>
     <div class="stat"><div class="num">${mi.toFixed(1)}</div><div class="lbl">Miles</div></div>
     <div class="stat"><div class="num">${ft.toLocaleString()}</div><div class="lbl">Ft climbed</div></div>
     <div class="stat"><div class="num">${peaks}</div><div class="lbl">Peaks</div></div>
     <div class="stat"><div class="num">${wild}</div><div class="lbl">Wildlife sightings</div></div>`;
}

// Filters
const types = [...new Set(LOG.map(e=>e.type))].sort();
const years = [...new Set(LOG.map(e=>e.date_start.slice(0,4)))].sort().reverse();
types.forEach(t=>ftype.insertAdjacentHTML('beforeend',`<option>${t}</option>`));
years.forEach(y=>fyear.insertAdjacentHTML('beforeend',`<option>${y}</option>`));

function matches(e) {
  const q = document.getElementById('q').value.trim().toLowerCase();
  if (ftype.value && e.type !== ftype.value) return false;
  if (fyear.value && !e.date_start.startsWith(fyear.value)) return false;
  if (!q) return true;
  const hay = JSON.stringify(e).toLowerCase();
  return q.split(/\s+/).every(w => hay.includes(w));
}

// Map — optional. If Leaflet (CDN) or the tile server is unreachable, the log still renders.
let map = null, markers = [];
try {
  if (typeof L !== 'undefined') {
    map = L.map('map').setView([44.3, -72.2], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'&copy; OpenStreetMap'}).addTo(map);
  }
} catch (err) { map = null; }
if (!map) document.getElementById('map').style.display = 'none';

function render() {
  const list = LOG.filter(matches).sort((a,b)=>b.date_start.localeCompare(a.date_start));
  renderStats(list);
  document.getElementById('count').textContent = `${list.length} of ${LOG.length} shown`;
  if (map) { markers.forEach(m=>map.removeLayer(m)); }
  markers = [];

  const el = document.getElementById('entries');
  if (!list.length) { el.innerHTML = '<div class="empty">Nothing matches — try fewer words.</div>'; return; }

  el.innerHTML = list.map(e => `
    <article class="entry" id="e-${e.id}">
      <div class="entry-head"><h2>${e.title}</h2><span class="date">${fmtDate(e)}</span></div>
      <div class="badges">
        <span class="badge type">${e.subtype || e.type}</span>
        ${(e.companions||[]).map(c=>`<span class="badge">&#128101; ${c}</span>`).join('')}
        ${(e.peaks||[]).map(p=>`<span class="badge">&#9650; ${p}</span>`).join('')}
        ${(e.wildlife||[]).map(w=>`<span class="badge wildlife">&#128062; ${w}</span>`).join('')}
        ${(e.tags||[]).map(t=>`<span class="badge">${t}</span>`).join('')}
      </div>
      <div class="metrics">
        ${e.distance_mi ? `<div class="metric"><div class="v">${e.distance_mi} mi</div><div class="k">Distance</div></div>` : ''}
        ${e.elevation_gain_ft ? `<div class="metric"><div class="v">${e.elevation_gain_ft.toLocaleString()} ft</div><div class="k">Gain</div></div>` : ''}
        ${e.duration ? `<div class="metric"><div class="v">${e.duration}</div><div class="k">Time</div></div>` : ''}
        <div class="metric"><div class="v">${e.location.split(',')[0]}</div><div class="k">Location</div></div>
      </div>
      ${e.weather ? `<div class="weather">&#127780;&#65039; ${e.weather}</div>` : ''}
      <div class="notes">${e.notes || ''}</div>
      <div class="gallery">
        ${(e.photos&&e.photos.length) ? e.photos.map(p=>`<img loading="lazy" src="photos/${e.id}/thumb/${web(p)}" data-full="photos/${e.id}/${web(p)}" alt="" onclick="lightboxImg.src=this.dataset.full;lightbox.style.display='flex'">`).join('')
          : '<span class="none">No photos yet</span>'}
      </div>
      ${(e.links||[]).length ? `<div class="notes" style="padding-top:0">${e.links.map(l=>`<a href="${l.url}" target="_blank">${l.label}</a>`).join(' &middot; ')}</div>` : ''}
    </article>`).join('');

  if (map) {
    list.filter(e=>e.lat).forEach(e=>{
      const m = L.marker([e.lat,e.lng]).addTo(map)
        .bindPopup(`<b>${e.title}</b><br>${fmtDate(e)}<br><a href="#e-${e.id}">Jump to entry</a>`);
      markers.push(m);
    });
    if (markers.length) map.fitBounds(L.featureGroup(markers).getBounds().pad(0.5), {maxZoom: 9});
  }
}

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
['q','ftype','fyear'].forEach(id => document.getElementById(id).addEventListener('input', render));
render();
</script>
